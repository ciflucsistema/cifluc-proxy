# Keep-alive: impede o sleep de 15 min do Render Free.
# Repo público => GitHub Actions ilimitado (zero custo).
name: keep-render-awake

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *' # a cada 10 min (offset p/ não colidir)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /ping (3 tentativas)
        run: |
          for i in 1 2 3; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 45 \
              https://ciflucsistema.onrender.com/ping || true)
            echo "tentativa $i -> $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "servico respondeu diferente de 200 — verificar"
          exit 1
